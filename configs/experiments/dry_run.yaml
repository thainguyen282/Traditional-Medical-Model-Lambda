
name: "unsloth/Qwen3-4B-Instruct-2507-dryrun"

model: 
  name: "unsloth/Qwen3-4B-Instruct-2507"
  max_seq_length: 2048

datasets:
    - path: "configs/dataset/venera_med_m1.yaml"
      train_samples: 30
      train_val_split: 0.2

benchmark:
  path: "configs/evals/minimal_mmlu.yaml"
  rerun_base_line: True

unsloth:
    load_in_4bit: true
    attn_implementation: "sdpa"

training:
    output_dir: "group_outputs/outputs"

    # 🔥 QUAN TRỌNG NHẤT
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1

    per_device_eval_batch_size: 1
    num_train_epochs: 20

    weight_decay: 0.01
    warmup_steps: 5
    lr_scheduler_type: "cosine"
    optim: "adamw_8bit"

    eval_strategy: "no"
    save_strategy: "no"

    logging_steps: 1
    seed: 3407

    bf16: False
    fp16: False

lora:
    lora_dropout: 0.1
    target_modules: 
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    bias: "none"
    use_rslora: false

monitoring:
  project: "VeneraMedicalM1"
  tags: ["lora", "unsloth","unsloth/Qwen3-0.6B-Base-unsloth-bnb-4bit","exp0001"]
