name: "unsloth/Qwen3-4B-Instruct-2507-0004"

model:
  # SFT-only từ base Instruct (KHÔNG qua CPT). Comparable với exp0001/config.yaml.
  name: "unsloth/Qwen3-4B-Instruct-2507"
  max_seq_length: 2048

datasets:
  - path: "configs/dataset/venera_med_new_mc.yaml"
    train_samples: -1
    train_val_split: 0.2

benchmark:
  path: "configs/evals/minimal_mmlu.yaml"

unsloth:
  # A10-compatible (4-bit). Đổi sang false nếu chạy A100 40GB.
  load_in_4bit: true
  attn_implementation: "sdpa"

training:
  output_dir: "group_outputs/outputs"
  # batch 2 + grad_accum 2 = effective batch 4 (match exp0001).
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 2
  num_train_epochs: 1
  # lr 2e-4: SFT-from-base, theo exp0001/config.yaml (KHÔNG có CPT adapter
  # cần protect → lr cao hơn CPT-SFT).
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  eval_strategy: "steps"
  eval_steps: 40
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: true
  save_steps: 40
  seed: 3407
  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  # NEFTune giữ giống exp0003 — đã chứng minh +0.36% VM14K, deviation về 0%.
  neftune_noise_alpha: 5

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: true

monitoring:
  project: "VeneraMedicalM1"
  tags: ["lora", "unsloth", "unsloth/Qwen3-4B-Instruct-2507", "exp0004", "new-multiplechoice", "sft-only", "neftune"]
