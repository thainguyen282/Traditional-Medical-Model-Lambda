name: "unsloth/Qwen3-4B-Instruct-2507-0009"

model:
  # Stage-2 SFT: continue the Exp0007 adapter trained on QA-20K.
  name: "huyennkai/Venera-Traditional-Model"
  revision: "cpt-sft-unsloth-qwen3-4B-exp0007-tm-sft-1782355488"
  max_seq_length: 2048

datasets:
  # VM14K only. The loader reads the upstream train split (535 rows) and
  # reserves 10% for validation; the official 29-row test split is untouched.
  # QA-20K knowledge comes only from the Exp0007 checkpoint above.
  - path: "configs/dataset/venera_vm14k_mcq.yaml"
    train_samples: -1
    train_val_split: 0.1

benchmark:
  path: "configs/evals/minimal_mmlu.yaml"

unsloth:
  load_in_4bit: true
  attn_implementation: "sdpa"

training:
  output_dir: "group_outputs/outputs"
  # Preserve Exp0007's effective batch of 4 while using a larger microbatch
  # to reduce gradient-accumulation overhead on the A100 40 GB.
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  per_device_eval_batch_size: 8
  num_train_epochs: 3
  # Low LR reduces forgetting while specializing the existing Exp0007
  # adapter on VM14K.
  learning_rate: 5e-5
  weight_decay: 0.01
  # The VM14K-only run has only ~360 optimizer steps across three epochs.
  warmup_steps: 20
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  eval_strategy: "steps"
  eval_steps: 40
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: true
  save_steps: 40
  seed: 3407
  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  neftune_noise_alpha: 5

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: true

monitoring:
  project: "VeneraMedicalM1"
  tags: ["lora", "unsloth", "unsloth/Qwen3-4B-Instruct-2507", "exp0009", "qa20k-to-vm14k", "stage2-sft", "neftune"]
