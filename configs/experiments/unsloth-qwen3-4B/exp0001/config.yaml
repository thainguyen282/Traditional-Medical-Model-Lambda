name: "unsloth/Qwen3-4B-Instruct-2507-0001"

model:
  # Dùng model đã merge CPT LoRA (output của CPT/CPT.py)
  # Đổi về "unsloth/Qwen3-4B-Instruct-2507" nếu muốn SFT từ model gốc
  name: "CPT/cpt_qwen3_medical_merged"
  # name: "unsloth/Qwen3-4B-Instruct-2507"
  max_seq_length: 2048

datasets:
  - path: "configs/dataset/venera_med_m1.yaml"
    train_samples: -1
    train_val_split: 0.2

benchmark:
  path: "configs/evals/minimal_mmlu.yaml"

unsloth:
  load_in_4bit: true
  attn_implementation: "sdpa"

training:
  output_dir: "group_outputs/outputs"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  num_train_epochs: 5
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 50
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  eval_strategy: "steps"
  eval_steps: 40
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: true
  save_steps: 40
  seed: 3407
  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"
  use_rslora: false

layer_freeze:
  freeze_ratio: 0.5  # Freeze 50% bottom layers

ewc:
  enabled: true
  lambda: 500  # EWC penalty strength
  num_samples: 200  # Samples to estimate Fisher information
  fisher_dataset: "parquet"
  fisher_data_files: "CPT/train-00000-of-00001.parquet"  # CPT data đông y
  fisher_max_length: 512

monitoring:
  project: "VeneraMedicalM1"
  tags: ["lora", "unsloth", "unsloth/Qwen3-4B-Instruct-2507", "exp0001"]