name: "unsloth/Qwen3-4B-unsloth-bnb-4bit-0001"

model: 
  name: "unsloth/Qwen3-4B-unsloth-bnb-4bit"
  max_seq_length: 2048

datasets:
  - path: "configs/dataset/venera_med_m1.yaml"
    train_samples: -1 
    train_val_split: 0.2

benchmark:
  path: "configs/evals/minimal_mmlu.yaml"

unsloth:
  load_in_4bit: true
  attn_implementation: "sdpa"

training:
  output_dir: "group_outputs/outputs"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  num_train_epochs: 10
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 50
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  eval_strategy: "steps"
  eval_steps: 40
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: false
  save_steps: 40
  seed: 3407
  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

lora:
  lora_dropout: 0.1
  target_modules: 
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: false

monitoring:
  project: "VeneraMedicalM1"
  tags: ["lora", "unsloth", "unsloth/Qwen3-4B-unsloth-bnb-4bit", "exp0001"]