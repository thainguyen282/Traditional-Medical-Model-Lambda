name: "unsloth/Qwen3-4B-Instruct-2507-0001"

model:
  # Trỏ thẳng tới LoRA adapter của CPT (KHÔNG merge).
  # Unsloth sẽ tự load base model + adapter, SFT sẽ continue-train adapter đó.
  # Đổi về "unsloth/Qwen3-4B-Instruct-2507" nếu muốn SFT từ base model.
  name: "CPT/cpt_qwen3_medical"
  # name: "unsloth/Qwen3-4B-Instruct-2507"
  max_seq_length: 2048

datasets:
  - path: "configs/dataset/venera_med_m1.yaml"
    train_samples: -1
    train_val_split: 0.2

benchmark:
  path: "configs/evals/minimal_mmlu.yaml"

unsloth:
  # Giữ nhất quán với CPT (CPT train ở full precision).
  # Nếu GPU không đủ RAM, đổi lại true — nhưng kết quả sẽ kém hơn.
  load_in_4bit: false
  attn_implementation: "sdpa"

training:
  output_dir: "group_outputs/outputs"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  num_train_epochs: 2
  # Giảm 5x so với SFT-from-base: adapter đã pre-adapted từ CPT,
  # lr cao sẽ xoá kiến thức CPT đã học.
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  eval_strategy: "steps"
  eval_steps: 40
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: true
  save_steps: 40
  seed: 3407
  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: true

monitoring:
  project: "VeneraMedicalM1"
  tags: ["lora", "unsloth", "unsloth/Qwen3-4B-Instruct-2507", "exp0001"]