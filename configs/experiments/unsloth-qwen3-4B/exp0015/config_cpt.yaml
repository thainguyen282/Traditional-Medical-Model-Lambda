name: "qwen3-4b-thinking-2507-cpt"

# Experiment manifest for the legacy Unsloth CPT pipeline in CPT/CPT.py.
# CPT is raw next-token training, so no chat template or thinking switch is
# applied during training. Use the model's normal thinking template at eval.
pipeline:
  type: "continual_pretraining"
  implementation: "CPT/CPT.py"

model:
  name: "Qwen/Qwen3-4B-Thinking-2507"
  max_seq_length: 2048

dataset:
  name: "Maverfrick/TradMed-CPT-53k-2048"
  train_split: "train"
  validation_split: "validation"
  text_field: "text"
  packing: true
  add_chat_template: false
  add_special_tokens: false

unsloth:
  load_in_4bit: false

training:
  output_dir: "CPT/cpt_qwen3_thinking_2507_medical"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 3.0e-5
  embedding_learning_rate: 3.0e-6
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  eval_strategy: "steps"
  eval_steps: 200
  save_steps: 500
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: true
  seed: 3407

lora:
  r: 64
  lora_alpha: 64
  lora_dropout: 0
  bias: "none"
  use_rslora: true
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

monitoring:
  project: "VeneraMedicalM1"
  tags:
    - "cpt"
    - "unsloth"
    - "qwen3-4b-thinking-2507"
    - "raw-text"
    - "one-epoch"
