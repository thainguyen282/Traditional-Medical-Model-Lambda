name: qwen3.5-4b-cpt-pilot
pilot:
  enabled: true
  mode: mixed
  prepared_dir: CPT/pilot_data/smoke/prepared
  preparation_config: configs/data/cpt-pilot/prepare-smoke.yaml
model:
  name: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  tokenizer_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  max_seq_length: 2048
dataset:
  add_chat_template: false
  packing: true
  add_special_tokens: false
unsloth:
  load_in_4bit: false
  gradient_checkpointing: true
hardware:
  instance_type: gpu_1x_a100_sxm4
  vram_gb: 40
lora:
  r: 64
  lora_alpha: 64
  lora_dropout: 0
  bias: none
  use_rslora: true
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  output_dir: CPT/pilot_outputs/smoke
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  num_train_epochs: 1
  learning_rate: 3.0e-05
  embedding_learning_rate: 3.0e-06
  fp16: false
  bf16: true
  logging_steps: 1
  optim: adamw_8bit
  lr_scheduler_type: cosine
  save_steps: 500
  save_total_limit: 2
  eval_strategy: steps
  eval_steps: 200
  seed: 42
  max_steps: 2
evaluation:
  dataset: vm14k
  enable_thinking: true
  max_input_tokens: 2048
  max_new_tokens: 32768
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  seed: 3407
