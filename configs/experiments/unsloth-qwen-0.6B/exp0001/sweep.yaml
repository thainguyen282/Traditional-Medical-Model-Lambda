command:
  - ${env}      
  - python
  - main.py      
  - "--sweep"
  - "${args}"

method: "bayes"
metric:
  name: "eval/loss"
  goal: "minimize"

parameters:
  config:
    value: "/root/VeneraMedicalM1/configs/experiments/qwen-0.6B/exp0001/config.yaml"
  training.batch_size:
    values: [4, 8, 16]
  adapter.lora_rank:
    values: [8, 16, 32, 64]
  context_length:
    values: [512, 1024, 2048]

early_terminate:
  metric: "eval/loss"
  min_delta: 0.0
  patience: 3