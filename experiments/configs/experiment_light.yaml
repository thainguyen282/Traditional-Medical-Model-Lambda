experiments:

  - name: Fine tune unsloth/Qwen3-0.6B
    model: "unsloth/Qwen3-0.6B"
    dataset: 
        - tag: fine_tome
          name: mlabonne/FineTome-100k
          train:
            n_samples: 30
          val:
            percent: 0.2
        - tag: dummy


    batch_size: 4
    max_seq_length: 2048
    output_dir: "output"

  - name: "Fine tune unsloth/Qwen3-1.7B-"
    model: "unsloth/Qwen3-1.7B"
    dataset:
      - tag: fine_tome
        name: mlabonne/FineTome-100k
        train:
          n_samples: 30
        val:
          percent: 0.2
      - tag: dummy
  
    batch_size: 4
    max_seq_length: 2048
    output_dir: "output"