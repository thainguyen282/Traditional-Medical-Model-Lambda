experiments:
  - name: "unsloth/Qwen3-0.6B"
    model: "unsloth/Qwen3-0.6B"
    max_seq_length: 2048
    output_dir: "./outputs"
    learning_rate: 2e-4  # Moved to top level
    lora_r: 32           # Moved to top level
    lora_alpha: 32       # Moved to top level
    gradient_accumulation_steps: 4  # Moved to top level
    
  - name: "unsloth/Qwen3-1.7B"
    model: "unsloth/Qwen3-1.7B"
    max_seq_length: 2048
    output_dir: "./outputs"
    learning_rate: 2e-4  # Moved to top level
    lora_r: 32           # Moved to top level
    lora_alpha: 32       # Moved to top level
    gradient_accumulation_steps: 4  # Moved to top level

defaults:
  dataset:
    - tag: "fine_tome"
      path: "mlabonne/FineTome-100k"
      train_samples: 30
      weight: 0.7

  # Keep non-swept parameters nested
  training:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 4
    num_train_epochs: 3
    weight_decay: 0.01
    warmup_steps: 100
    lr_scheduler_type: "cosine"
    optim: "adamw_8bit"
    eval_strategy: "steps"
    eval_steps: 50
    save_strategy: "steps"
    save_steps: 100
    logging_steps: 10
    seed: 3407
  
  lora:
    lora_dropout: 0.1
    target_modules: 
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    bias: "none"
    use_rslora: false
  
  monitoring:
    report_to: "wandb"
    project_name: "VeneraMedicalM1"
    track_gpu_memory: true
    alert_thresholds:
      gpu_memory: 0.9
      loss_divergence: 2.0

sweep:
  method: "bayes"
  metric:
    name: "eval_loss"
    goal: "minimize"
  early_terminate:
    type: "hyperband"
    min_iter: 100
    eta: 2
  parameters:
    learning_rate:
      distribution: "log_uniform"
      min: 5e-5
      max: 5e-4
    lora_r:
      values: [16, 32, 64]
    max_seq_length:
      values: [1024, 2048]
    gradient_accumulation_steps:
      values: [4, 8]
    lora_alpha:
      values: [16, 32, 64]